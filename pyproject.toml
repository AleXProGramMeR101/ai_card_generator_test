[project]
name = "card-generator"
version = "0.1.0"
description = "Автогенерация каточек товара"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error::DeprecationWarning:card_generator.*"]